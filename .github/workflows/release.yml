name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-host -> target

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item "target/release/rust-sentinel-bridge.exe" "$dist/" -Force
          Copy-Item "../README.md", "../LICENSE", "../NOTICE" "$dist/" -Force

          # Portable bundle: exe + drop-in host manifest template.
          $manifest = @{
            name            = "com.rustsentinel.bridge"
            description     = "Rust Sentinel Bridge native messaging host"
            path            = "rust-sentinel-bridge.exe"
            type            = "stdio"
            allowed_origins = @("chrome-extension://EXTENSION_ID_PLACEHOLDER/")
          } | ConvertTo-Json -Depth 4
          Set-Content -Path "$dist/com.rustsentinel.bridge.json" -Value $manifest -Encoding UTF8

          Compress-Archive -Path "$dist/*" -DestinationPath "rust-sentinel-bridge-$tag-win64.zip" -Force
          Compress-Archive -Path "../extension/*" -DestinationPath "rust-sentinel-extension-$tag.zip" -Force

          Get-FileHash "target/release/rust-sentinel-bridge.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  rust-sentinel-bridge.exe" } |
            Set-Content -Path "$dist/rust-sentinel-bridge.exe.sha256" -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            native-host/dist/rust-sentinel-bridge.exe
            native-host/dist/rust-sentinel-bridge.exe.sha256
            native-host/dist/com.rustsentinel.bridge.json
            native-host/rust-sentinel-bridge-*.zip
