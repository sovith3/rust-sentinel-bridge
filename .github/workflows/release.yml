name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  release:
    name: Build, package and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-host -> target

      - name: Build native host (release)
        working-directory: native-host
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"

          $exe = "native-host/target/$env:TARGET/release/rust-sentinel-bridge.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "release binary not found at $exe"
          }

          $dist = "native-host/dist"
          Remove-Item -LiteralPath $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Portable drop-in folder: the exe, the one-shot installer, the docs.
          Copy-Item -LiteralPath $exe -Destination "$dist/rust-sentinel-bridge.exe"
          Copy-Item -LiteralPath "README.md", "LICENSE", "NOTICE", "install.ps1", "uninstall.ps1" -Destination $dist
          Copy-Item -LiteralPath "docs/PROTOCOL.md" -Destination "$dist/PROTOCOL.md"
          Copy-Item -LiteralPath "docs/INSTALL.md" -Destination "$dist/INSTALL.md"

          # Portable bundle (exe + install.ps1 + docs) and the unpacked extension.
          $hostZip = "rust-sentinel-bridge-$tag-win64.zip"
          $extZip = "rust-sentinel-extension.zip"
          Remove-Item -LiteralPath $hostZip, $extZip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$dist/*" -DestinationPath $hostZip -CompressionLevel Optimal
          Compress-Archive -Path "extension/*" -DestinationPath $extZip -CompressionLevel Optimal

          # Fail instead of shipping a zip with the wrong layout.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $extensionEntries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $extZip)).Entries.FullName
          if ($extensionEntries -notcontains "manifest.json") {
            throw "$extZip does not contain manifest.json at its root"
          }
          $hostEntries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $hostZip)).Entries.FullName
          foreach ($required in @("rust-sentinel-bridge.exe", "install.ps1", "uninstall.ps1", "INSTALL.md")) {
            if ($hostEntries -notcontains $required) {
              throw "$hostZip is missing $required"
            }
          }

          $sums = foreach ($file in @($exe, $hostZip, $extZip)) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, (Split-Path -Leaf $file)
          }
          $sums | Set-Content -LiteralPath "SHA256SUMS.txt" -Encoding ascii

          Get-Content -LiteralPath "SHA256SUMS.txt" | Write-Host

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Rust Sentinel Bridge ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Zero-port bridge between any HTTPS page and Windows: local Ollama, file
            scanning, hardware telemetry and the League of Legends LCU.

            ### What changed

            * **Champion select logs no longer go silent.** The LCU subscription used to
              die for good when the lockfile was missing, so subscribing before the
              client started (or before queueing up) left the event log empty. It now
              keeps retrying, streams `OnJsonApiEvent_lol-gameflow_v1_gameflow-phase`
              too, and falls back to HTTPS polling when the loopback socket is blocked.
            * Duplicate `ws` + `poll` frames are deduplicated, so one change in the client
              is one log line with one sequence number. Repeated identical socket failures
              are reported once instead of every 3 s, so the log stays readable.
            * The extension replays streaming requests after a service-worker or native
              host restart, and the demo page subscribes to champion select when you open
              the *League LCU* tab.
            * `install.ps1` now works as a one-line command: it downloads and verifies the
              host, extracts the extension when it has to, and keeps `uninstall.ps1`
              version-agnostic. Both scripts also survive being piped into PowerShell.

            ### Install in one command

            ```powershell
            irm https://github.com/sovith3/rust-sentinel-bridge/releases/latest/download/install.ps1 | iex
            ```

            The installer fetches this release's binary, compares it with `SHA256SUMS.txt`,
            installs it in `%LOCALAPPDATA%\RustSentinelBridge`, writes the native messaging
            manifest and saves `extension_id.txt`, then registers the host under `HKCU` for
            Chrome, Edge, Brave, Vivaldi and Chromium. No administrator rights, no `PATH`
            changes, no service, no open port.

            Then load the extension once - only the browser can create its 32-character id:

            1. Open `chrome://extensions` (Edge: `edge://extensions`), enable **Developer mode**.
            2. Click **Load unpacked** and pick `%LOCALAPPDATA%\RustSentinelBridge\extension` -
               the installer extracts the extension there when it does not know your id yet.
               Already loaded from another folder? Keep it and paste that id.
            3. Paste the id into the installer if it is still waiting, press Enter, then click
               the reload arrow on the extension card.

            Open the live demo - <https://sovith3.github.io/rust-sentinel-bridge/> - and the
            badge turns green once the host answers a `PING`.

            Prefer the manual route? `rust-sentinel-bridge-{0}-win64.zip` still contains the
            exe, `install.ps1`, `uninstall.ps1` and the docs, and `rust-sentinel-extension.zip`
            holds the unpacked extension. Step-by-step guide for both paths:
            [docs/INSTALL.md](https://github.com/sovith3/rust-sentinel-bridge/blob/main/docs/INSTALL.md).

            ### Uninstall any version

            ```powershell
            irm https://github.com/sovith3/rust-sentinel-bridge/releases/latest/download/uninstall.ps1 | iex
            ```

            Add `-DryRun` to see what would be removed and `-KeepLog` to keep `bridge.log`;
            those switches need the downloaded file, because a piped command cannot pass
            arguments.

            Verify the download with:

            ```powershell
            Get-FileHash .\rust-sentinel-bridge-*-win64.zip -Algorithm SHA256
            ```

            `SHA256SUMS.txt` lists every asset. Builds are produced on
            `windows-latest` with the MSVC toolchain and a statically linked CRT.
          files: |
            native-host/dist/rust-sentinel-bridge.exe
            rust-sentinel-bridge-*-win64.zip
            rust-sentinel-extension.zip
            install.ps1
            uninstall.ps1
            SHA256SUMS.txt
