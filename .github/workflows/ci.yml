name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # NOTE: RUSTFLAGS is intentionally NOT set here. The crate needs
  # `-C target-feature=+crt-static` from native-host/.cargo/config.toml, and an
  # environment RUSTFLAGS would silently override that file.

jobs:
  rust:
    name: Rust host (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-host -> target

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-sentinel-bridge-msvc
          path: native-host/target/release/rust-sentinel-bridge.exe
          if-no-files-found: error

  rust-gnu:
    name: Rust host (GNU fallback)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64 GCC
        run: choco install mingw --no-progress -y

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-host -> target
          key: gnu

      - name: Build (release)
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

  web:
    name: Web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check extension and demo scripts
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest.json ok')"

      - name: Validate demo HTML is self-contained
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("web-demo/index.html", "utf8");
          if (!html.includes("rust-sentinel-bridge")) {
            throw new Error("demo lost its bridge channel");
          }
          if (!html.includes("Bridge Connected") || !html.includes("Extension Not Detected")) {
            throw new Error("demo lost its connection states");
          }
          console.log("web-demo ok");
          NODE

      - name: Syntax-check the demo inline script
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("web-demo/index.html", "utf8");
          const blocks = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
          if (blocks.length === 0) {
            throw new Error("no inline script found in web-demo/index.html");
          }
          for (const code of blocks) {
            new Function(code);
          }
          console.log(`web-demo script ok (${blocks.length} block)`);
          NODE

      - name: Verify the demo has no external assets
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("web-demo/index.html", "utf8");
          const external = [...html.matchAll(/(?:src|srcset|href)="([^"]+)"/g)]
            .map((match) => match[1])
            .filter((url) => /^(https?:)?\/\//.test(url))
            .filter((url) => !url.includes("github.com"));
          if (external.length > 0) {
            throw new Error(`external assets would break GitHub Pages: ${external.join(", ")}`);
          }
          console.log("web-demo is self-contained");
          NODE

  scripts:
    name: Installer scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse install.ps1 and uninstall.ps1
        shell: pwsh
        run: |
          foreach ($script in @("install.ps1", "uninstall.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=$script::$($_.Message)" }
              exit 1
            }
            Write-Host "$script parses cleanly"
          }

      - name: Show installer help
        shell: pwsh
        run: ./install.ps1 -? | Out-String | Write-Host

      - name: Show uninstaller help
        shell: pwsh
        run: ./uninstall.ps1 -? | Out-String | Write-Host

      - name: Uninstaller dry run
        shell: pwsh
        run: ./uninstall.ps1 -DryRun | Out-String | Write-Host

