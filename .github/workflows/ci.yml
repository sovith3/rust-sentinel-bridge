name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # NOTE: RUSTFLAGS is intentionally NOT set here. The crate needs
  # `-C target-feature=+crt-static` from native-host/.cargo/config.toml, and an
  # environment RUSTFLAGS would silently override that file.

jobs:
  rust:
    name: Rust host (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-host -> target

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-sentinel-bridge-msvc
          path: native-host/target/release/rust-sentinel-bridge.exe
          if-no-files-found: error

  rust-gnu:
    name: Rust host (GNU fallback)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64 GCC
        run: choco install mingw --no-progress -y

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-host -> target
          key: gnu

      - name: Build (release)
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

  web:
    name: Web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check extension and demo scripts
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest.json ok')"

      - name: Validate demo HTML is self-contained
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("web-demo/index.html", "utf8");
          if (!html.includes("rust-sentinel-bridge")) {
            throw new Error("demo lost its bridge channel");
          }
          if (!html.includes("Bridge Connected") || !html.includes("Extension Not Detected")) {
            throw new Error("demo lost its connection states");
          }
          console.log("web-demo ok");
          NODE

      - name: Syntax-check the demo inline script
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("web-demo/index.html", "utf8");
          const blocks = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
          if (blocks.length === 0) {
            throw new Error("no inline script found in web-demo/index.html");
          }
          for (const code of blocks) {
            new Function(code);
          }
          console.log(`web-demo script ok (${blocks.length} block)`);
          NODE

      - name: Verify the demo has no external assets
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("web-demo/index.html", "utf8");
          const external = [...html.matchAll(/(?:src|srcset|href)="([^"]+)"/g)]
            .map((match) => match[1])
            .filter((url) => /^(https?:)?\/\//.test(url))
            .filter((url) => !url.includes("github.com"));
          if (external.length > 0) {
            throw new Error(`external assets would break GitHub Pages: ${external.join(", ")}`);
          }
          console.log("web-demo is self-contained");
          NODE

  scripts:
    name: Installer scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse install.ps1 and uninstall.ps1
        shell: pwsh
        run: |
          foreach ($script in @("install.ps1", "uninstall.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=$script::$($_.Message)" }
              exit 1
            }
            Write-Host "$script parses cleanly"
          }

      - name: Show installer help
        shell: pwsh
        run: ./install.ps1 -? | Out-String | Write-Host

      - name: Show uninstaller help
        shell: pwsh
        run: ./uninstall.ps1 -? | Out-String | Write-Host

      - name: Uninstaller dry run
        shell: pwsh
        run: ./uninstall.ps1 -DryRun | Out-String | Write-Host

      - name: Offline installer dry run
        shell: pwsh
        run: |
          # GitHub runs pwsh with $ErrorActionPreference = 'stop'; native stderr must not
          # become a terminating error, so the child process writes to a log file instead.
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "rsb-ci"
          $log = Join-Path $env:RUNNER_TEMP "rsb-ci-install.log"
          $placeholder = "./rust-sentinel-bridge.exe"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          # This job has no cargo build, so the installer gets a stand-in binary.
          Set-Content -LiteralPath $placeholder -Value "ci placeholder" -Encoding ascii
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -DryRun -NoDownload -ExtensionId abcdefghijklmnopabcdefghijklmnop -InstallDir $target *> $log
            $code = $LASTEXITCODE
            Get-Content -LiteralPath $log | Write-Host
            if ($code -ne 0) {
              throw "install.ps1 exited with $code"
            }
            $manifestPath = Join-Path $target "com.rustsentinel.bridge.json"
            if (-not (Test-Path -LiteralPath $manifestPath)) {
              throw "install.ps1 did not write the native messaging manifest"
            }
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $expected = "chrome-extension://abcdefghijklmnopabcdefghijklmnop/"
            if ($manifest.allowed_origins.Count -ne 1 -or $manifest.allowed_origins[0] -ne $expected) {
              throw "wrong allowed_origins: $($manifest.allowed_origins -join ', ')"
            }
            if ($manifest.type -ne "stdio" -or $manifest.name -ne "com.rustsentinel.bridge") {
              throw "unexpected manifest: $($manifest | ConvertTo-Json -Compress)"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $target "extension_id.txt"))) {
              throw "install.ps1 did not record extension_id.txt"
            }
            Write-Host "install.ps1 dry run produced a valid manifest"
          } finally {
            Remove-Item -LiteralPath $placeholder -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }

      - name: Reject an invalid extension id
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = Join-Path $env:RUNNER_TEMP "rsb-ci-bad"
          $log = Join-Path $env:RUNNER_TEMP "rsb-ci-bad.log"
          $placeholder = "./rust-sentinel-bridge.exe"
          Set-Content -LiteralPath $placeholder -Value "ci placeholder" -Encoding ascii
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -DryRun -NoDownload -ExtensionId "zzzz" -InstallDir $target *> $log
            $code = $LASTEXITCODE
            $output = Get-Content -LiteralPath $log -Raw
            if ($code -eq 0) {
              throw "install.ps1 accepted an invalid extension id"
            }
            if ($output -notmatch "Invalid extension id") {
              Write-Host $output
              throw "install.ps1 failed without explaining the id problem"
            }
            Write-Host "invalid id rejected with a readable message (exit $code)"
          } finally {
            Remove-Item -LiteralPath $placeholder -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
