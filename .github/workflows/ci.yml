name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # NOTE: RUSTFLAGS is intentionally NOT set here. The crate needs
  # `-C target-feature=+crt-static` from native-host/.cargo/config.toml, and an
  # environment RUSTFLAGS would silently override that file.

jobs:
  rust:
    name: Rust host (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-host -> target

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-sentinel-bridge-msvc
          path: native-host/target/release/rust-sentinel-bridge.exe
          if-no-files-found: error

  rust-gnu:
    name: Rust host (GNU fallback)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native-host
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64 GCC
        run: choco install mingw --no-progress -y

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-host -> target
          key: gnu

      - name: Build (release)
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

  web:
    name: Web assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check extension and demo scripts
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); console.log('manifest.json ok')"

      - name: Validate demo HTML is self-contained
        run: |
          node -e "const s=require('fs').readFileSync('web-demo/index.html','utf8'); if(!s.includes('rust-sentinel-bridge')) throw new Error('demo lost its bridge channel'); console.log('web-demo ok')"
