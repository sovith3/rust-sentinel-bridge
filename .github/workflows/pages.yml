name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web-demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy live demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages with the "GitHub Actions" source the first time this runs.
          enablement: true

      - name: Upload web-demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
